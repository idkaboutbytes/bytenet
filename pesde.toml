name = "idkaboutbytes/bytenet"
version = "1.0.0"
description = "ByteNet package for Roblox."
license = "MIT"
authors = ["idkaboutbytes"]
repository = "https://github.com/idkaboutbytes/bytenet"
includes = ["pesde.toml", "README.md", "CHANGELOG.md", "default.project.json", "src/**/*.luau"]

[target]
environment = "roblox"
lib = "src/init.luau"
build_files = ["src"]
[wally_indices]
default = "https://github.com/UpliftGames/wally-index"

[dependencies]
Promise = { repo = "idkaboutbytes/promise", rev = "v2.1.3" }
